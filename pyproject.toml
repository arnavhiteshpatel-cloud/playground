[project]
name = "osteoquant"
version = "0.1.0"
description = "Preclinical bone-defect imaging analysis (research prototype; not validated)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "scipy>=1.11", "scikit-image>=0.22", "scikit-learn>=1.4", "pandas>=2.0",
  "SimpleITK>=2.3", "tifffile>=2024.1", "pydicom>=2.4", "nibabel>=5.2", "pynrrd>=1.0",
  "zarr>=3.0", "olefile>=0.47", "imagecodecs", "matplotlib>=3.8", "statsmodels>=0.14",
  "fastapi>=0.110", "uvicorn>=0.29", "python-multipart", "reportlab>=4.0", "openpyxl>=3.1",
  "pyyaml", "psutil", "torch>=2.2",
]
[project.optional-dependencies]
dev = ["pytest>=8", "httpx"]
desktop = ["PySide6>=6.7", "vtk>=9.3", "cryptography>=42", "pytest-qt>=4.4"]
[project.scripts]
osteoquant = "osteoquant.cli:main"
[project.gui-scripts]
osteoquant-desktop = "osteoquant.desktop.app:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["osteoquant*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: long-running test (deselect with -m 'not slow')",
]
filterwarnings = [
  "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["osteoquant"]
omit = [
  "osteoquant/desktop/*",      # GUI built and tested separately (tests/desktop)
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "pragma: no cover",
]

[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = ["experiments", "investor", "publications", "business", "grants", "outreach", "founder"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = [
  "E501",   # long scientific expressions; enforced by review, not by lint
  "E702",   # compact one-liners used in a few places
  "E731",   # small local lambdas (curve models)
  "E741",   # 'l'/'I' used as mathematical symbols
  "E402",   # deliberate late imports in scripts
  "B008",   # FastAPI Depends()/File()/Form() defaults
  "B905",   # zip(strict=) not available on py3.9 code paths; arrays are length-checked
  "B023",   # closures over loop variables are evaluated immediately
  "B007",
]

[tool.ruff.lint.per-file-ignores]
# Unused imports in modules owned by other workstreams; tracked in docs/qa/DEFECTS_FOUND.md (QA-L01).
"osteoquant/desktop/**" = ["F401"]
"osteoquant/ml/train.py" = ["F401"]
"osteoquant/phantom/materials.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = false
no_implicit_optional = true
exclude = ["^experiments/", "^scripts/", "^tests/"]

[[tool.mypy.overrides]]
module = ["osteoquant.desktop.*"]
ignore_errors = true
